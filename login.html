<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar Sesión · SIGEP UTP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/sigep.css">
<style>
    /* Estilos del encabezado (copiados del portal) */
    .wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
    .p-head{background:var(--side);color:#fff;position:sticky;top:0;z-index:30}
    .p-head .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
    .p-head .logo small{color:var(--side-muted)}
    
    /* Estilos para centrar el login debajo del encabezado */
    body { background: var(--bg); display: flex; flex-direction: column; min-height: 100vh; }
    .login-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-container { background: var(--surface); border-radius: var(--r-lg); box-shadow: 0 10px 30px -5px rgba(0,0,0,0.1); width: 100%; max-width: 420px; padding: 40px; border: 1px solid var(--line); }
    .login-header { text-align: center; margin-bottom: 30px; }
    .login-header h1 { font-size: 1.6rem; margin-bottom: 5px; color: var(--text); }
    .login-header p { color: var(--muted); font-size: 0.9rem; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text); }
    .form-group input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-sm); font-family: inherit; font-size: 0.95rem; }
    .form-group input:focus { outline: 2px solid var(--m1); border-color: transparent; }
    .btn-login { width: 100%; padding: 14px; background: var(--m1); color: white; border: none; border-radius: var(--r-sm); font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 1rem; transition: background 0.3s; }
    .btn-login:hover { background: #be185d; }
</style>
</head>
<body data-modulo="1">
    
    <!-- ENCABEZADO AZUL OSCURO -->
    <header class="p-head">
      <div class="wrap">
        <a class="logo" href="portal.html"><span class="logo-mark"><i data-ic="cap" data-s="20"></i></span><span><b>SIGEP UTP</b><small>Sistema de Gestión de Estadías</small></span></a>
        <nav class="p-nav"><a href="portal.html">Volver al portal</a></nav>
      </div>
    </header>

    <!-- CONTENEDOR DEL LOGIN -->
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h1>Iniciar Sesión</h1>
                <p>Módulo 1: Expediente Digital</p>
            </div>
            <form onsubmit="event.preventDefault(); window.location.href='modulo-1.html';">
                <div class="form-group">
                    <label>Matrícula</label>
                    <input type="text" placeholder="Ingresa tu matrícula" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit" class="btn-login">Ingresar al Módulo</button>
            </form>
        </div>
    </div>

    <script src="js/sigep.js"></script>
</body>
</html>
